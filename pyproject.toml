[project]
name = "suryasetu"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "PT", "C4"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["rules/tests", "api/tests", "worker/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=rules --cov-fail-under=90"

[tool.coverage.run]
omit = ["*/tests/*"]
