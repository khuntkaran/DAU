# PM Surya Ghar rule set. This is the only place rule values are written.
# status: confirmed | verify | assumption. See .claude/skills/pm-surya-rules/references/rules.md
version: pm_surya_ghar_v2024_03
effective_from: 2024-02-13
checked_on: 2026-11-01

subsidy:
  general:
    first_slab_inr_per_kw: 30000
    second_slab_inr_per_kw: 18000
  special:
    first_slab_inr_per_kw: 33000
    second_slab_inr_per_kw: 19800
  first_slab_kw: 2
  second_slab_kw: 1

sizing:
  generation_kwh_per_kw_month: 120
  roof_m2_per_kw: 10
  default_usable_fraction: 0.8
  step_kw: 0.5

payback:
  default_tariff_inr_per_kwh: 6.50

scoring:
  weights:
    net_cost_per_kw: 30
    warranty: 20
    component_quality: 15
    completeness: 15
    timeline: 10
    vendor_rating: 10
  warranty_targets_years:
    panel: 25
    inverter: 10
    workmanship: 5
  max_vendor_rating: 5

